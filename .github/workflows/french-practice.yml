name: French Practice

# A push to a PR branch used to start the whole pipeline twice — once for the
# push and once for the pull_request — because both triggers matched every
# path. Pushes are now watched on the default branch only; PR branches are
# covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Secret guard (no shared/provider secrets via VITE_*)
        run: npm run check:secrets
      - name: Lint content
        run: npm run lint:content
      - name: Lint code (no-undef + React hooks)
        run: npm run lint:code
      - name: Lint tests (correctness: no-undef, no-dupe-keys, constant expressions)
        run: npm run lint:tests -- --quiet
      - name: Unit tests
        run: npm test
      # Named for what it actually does. `tsconfig.json` sets `checkJs: false`,
      # so tsc validates the tsconfig graph and the few .ts files — it does NOT
      # type-check the JavaScript that makes up this app. The step used to be
      # called "Type check (critical domain logic)" and was green while
      # inspecting nothing; the crash-class coverage for domain logic lives in
      # the ESLint step above (no-undef, react-hooks rules).
      # Turning on `checkJs` for src/lib is the real upgrade and needs JSDoc
      # annotations across the pure modules first — tracked, not pretended.
      - name: Type check (tsconfig sanity — JS is covered by ESLint)
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Size & performance check
        run: |
          du -sh .next 2>/dev/null || du -sh dist 2>/dev/null || du -sh build 2>/dev/null || echo "no build artifact to measure"
          node -e "const fs=require('fs');try{const s=require('child_process').execSync('du -sk .next 2>/dev/null || du -sk dist 2>/dev/null || echo 0',{encoding:'utf8'}).trim();console.log('SIZE_KB:'+s.split(/\s+/)[0])}catch(e){console.log('size check skipped')}"
          # Fails CI on budget breaches — do not swallow the exit code.
          node scripts/check-performance.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (happy path + failure modes + mobile)
        run: npx playwright test --reporter=list
